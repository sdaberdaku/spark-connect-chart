suite: serviceaccounts and rbac
chart:
  version: 1.0.0
  appVersion: 4.2.0
templates:
  - templates/serviceaccounts.yaml
  - templates/rbac.yaml
  - templates/driver.yaml
  - templates/configmap.yaml
tests:
  - it: renders both service accounts
    template: templates/serviceaccounts.yaml
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-driver}
        documentIndex: 0
      - equal: {path: automountServiceAccountToken, value: true}
        documentIndex: 0
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-executor}
        documentIndex: 1
      - equal: {path: automountServiceAccountToken, value: false}
        documentIndex: 1
  - it: passes annotations to the service accounts
    template: templates/serviceaccounts.yaml
    set: {serviceAccount: {driver: {annotations: {x: y}}}}
    asserts:
      - equal: {path: metadata.annotations, value: {x: y}}
        documentIndex: 0
  - it: skips the driver service account
    template: templates/serviceaccounts.yaml
    set: {serviceAccount: {driver: {create: false, name: mine}}}
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-executor}
  - it: skips the executor service account
    template: templates/serviceaccounts.yaml
    set: {serviceAccount: {executor: {create: false}}}
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-driver}
  - it: skips both service accounts
    template: templates/serviceaccounts.yaml
    set: {serviceAccount: {driver: {create: false, name: mine}, executor: {create: false}}}
    asserts:
      - hasDocuments: {count: 0}
  - it: fails when the driver service account is neither created nor named
    template: templates/rbac.yaml
    set: {serviceAccount: {driver: {create: false}}}
    asserts:
      - failedTemplate:
          errorMessage: serviceAccount.driver.name is required when serviceAccount.driver.create is false (the driver needs its own ServiceAccount with rights to manage executor pods)
  - it: uses the given name when not created
    template: templates/driver.yaml
    set: {serviceAccount: {driver: {create: false, name: mine}}}
    asserts:
      - equal: {path: spec.template.spec.serviceAccountName, value: mine}
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: true}
  - it: mounts the service account token in the driver pod
    template: templates/driver.yaml
    asserts:
      - equal: {path: spec.template.spec.automountServiceAccountToken, value: true}
  - it: grants the driver exactly the needed verbs
    template: templates/rbac.yaml
    documentIndex: 0
    asserts:
      - isKind: {of: Role}
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [pods], verbs: [create, get, list, watch, delete, deletecollection, patch]}
            - {apiGroups: [""], resources: [services], verbs: [create, get, list, watch, delete, deletecollection]}
            - {apiGroups: [""], resources: [configmaps], verbs: [create, get, list, watch, delete, deletecollection]}
            - {apiGroups: [""], resources: [persistentvolumeclaims], verbs: [create, get, list, watch, delete, deletecollection]}
  - it: binds only the driver service account
    template: templates/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind: {of: RoleBinding}
      - equal: {path: roleRef.kind, value: Role}
      - equal: {path: roleRef.name, value: RELEASE-NAME-spark-connect-driver}
      - equal: {path: subjects, value: [{kind: ServiceAccount, name: RELEASE-NAME-spark-connect-driver, namespace: NAMESPACE}]}
  - it: binds the role to an existing driver service account
    template: templates/rbac.yaml
    set: {serviceAccount: {driver: {create: false, name: mine}}}
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: Role}
        documentIndex: 0
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-driver}
        documentIndex: 1
      - equal: {path: subjects, value: [{kind: ServiceAccount, name: mine, namespace: NAMESPACE}]}
        documentIndex: 1
  - it: keeps role, binding and subject consistent for long names
    template: templates/rbac.yaml
    release: {name: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij}
    asserts:
      - equal: {path: metadata.name, value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        documentIndex: 0
      - equal: {path: metadata.name, value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        documentIndex: 1
      - equal: {path: roleRef.name, value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        documentIndex: 1
      - equal: {path: 'subjects[0].name', value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        documentIndex: 1
      - equal: {path: metadata.name, value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        template: templates/serviceaccounts.yaml
        documentIndex: 0
      - equal: {path: spec.template.spec.serviceAccountName, value: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghij-spark-driver}
        template: templates/driver.yaml
  - it: uses default for the executor service account when not created
    template: templates/configmap.yaml
    set: {serviceAccount: {executor: {create: false}}}
    asserts:
      - matchRegex: {path: 'data["spark-defaults.conf"]', pattern: '(?m)^spark.kubernetes.authenticate.executor.serviceAccountName default$'}
  - it: uses the given executor service account name when not created
    template: templates/configmap.yaml
    set: {serviceAccount: {executor: {create: false, name: ex}}}
    asserts:
      - matchRegex: {path: 'data["spark-defaults.conf"]', pattern: '(?m)^spark.kubernetes.authenticate.executor.serviceAccountName ex$'}
