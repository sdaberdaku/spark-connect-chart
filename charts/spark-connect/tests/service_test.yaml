suite: service
templates:
  - templates/service.yaml
tests:
  - it: renders a ClusterIP service for the driver only
    asserts:
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect}
      - equal: {path: spec.type, value: ClusterIP}
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: spark-connect
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: driver
      - contains: {path: spec.ports, content: {name: connect, port: 15002, targetPort: connect, appProtocol: kubernetes.io/h2c}}
      - contains: {path: spec.ports, content: {name: ui, port: 4040, targetPort: ui}}
  - it: passes annotations through
    set: {service: {annotations: {a: b}}}
    asserts:
      - equal: {path: metadata.annotations, value: {a: b}}
