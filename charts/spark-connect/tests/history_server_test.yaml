suite: history server
chart:
  version: 1.0.0
  appVersion: 4.2.0
templates:
  - templates/history-server.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments: {count: 0}
  - it: requires logDirectory
    set: {historyServer: {enabled: true}}
    asserts:
      - failedTemplate: {errorMessage: historyServer.logDirectory is required}
  - it: renders the deployment
    set:
      historyServer:
        enabled: true
        logDirectory: file:/spark-events
        conf: {spark.history.z: "1", spark.history.a: "2"}
        env: [{name: X, value: y}]
        volumes: [{name: ev, emptyDir: {}}]
        volumeMounts: [{name: ev, mountPath: /spark-events}]
        nodeSelector: {a: b}
        podAnnotations: {pa: v}
        podLabels: {pl: v}
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: Deployment}
        documentIndex: 0
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-history-server}
        documentIndex: 0
      - equal: {path: 'spec.selector.matchLabels["app.kubernetes.io/component"]', value: history-server}
        documentIndex: 0
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: history-server}
        documentIndex: 0
      - equal: {path: spec.template.metadata.labels.pl, value: v}
        documentIndex: 0
      - equal: {path: spec.template.metadata.annotations.pa, value: v}
        documentIndex: 0
      - equal: {path: spec.template.spec.serviceAccountName, value: RELEASE-NAME-spark-connect-executor}
        documentIndex: 0
      - equal: {path: spec.template.spec.nodeSelector, value: {a: b}}
        documentIndex: 0
      - equal: {path: spec.template.spec.securityContext.runAsUser, value: 185}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].name', value: history-server}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].command', value: [/opt/entrypoint.sh, /opt/spark/sbin/start-history-server.sh]}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem', value: true}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: SPARK_NO_DAEMONIZE, value: "true"}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: SPARK_LOG_DIR, value: /tmp/spark-logs}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: SPARK_PID_DIR, value: /tmp}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: SPARK_DAEMON_MEMORY, value: 1g}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: SPARK_HISTORY_OPTS, value: '-Dspark.history.fs.logDirectory="file:/spark-events" -Dspark.history.ui.port="18080" -Dspark.history.a="2" -Dspark.history.z="1"'}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: X, value: y}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].volumeMounts', content: {name: tmp, mountPath: /tmp}}
        documentIndex: 0
      - contains: {path: 'spec.template.spec.containers[0].volumeMounts', content: {name: ev, mountPath: /spark-events}}
        documentIndex: 0
      - contains: {path: spec.template.spec.volumes, content: {name: tmp, emptyDir: {}}}
        documentIndex: 0
      - contains: {path: spec.template.spec.volumes, content: {name: ev, emptyDir: {}}}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].readinessProbe.httpGet.port', value: http}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].livenessProbe.httpGet.port', value: http}
        documentIndex: 0
      - equal: {path: 'spec.template.spec.containers[0].ports[0]', value: {name: http, containerPort: 18080}}
        documentIndex: 0
  - it: renders the service
    set: {historyServer: {enabled: true, logDirectory: "file:/e"}}
    asserts:
      - isKind: {of: Service}
        documentIndex: 1
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-history-server}
        documentIndex: 1
      - equal: {path: 'spec.selector["app.kubernetes.io/component"]', value: history-server}
        documentIndex: 1
      - equal: {path: 'spec.ports[0].name', value: http}
        documentIndex: 1
      - equal: {path: 'spec.ports[0].port', value: 18080}
        documentIndex: 1
      - equal: {path: 'spec.ports[0].targetPort', value: http}
        documentIndex: 1
  - it: quotes values with spaces, quotes and backslashes
    set:
      historyServer:
        enabled: true
        logDirectory: "file:/e"
        conf: {spark.ui.filters: 'a b', spark.x: 'p\q"r'}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: {name: SPARK_HISTORY_OPTS, value: '-Dspark.history.fs.logDirectory="file:/e" -Dspark.history.ui.port="18080" -Dspark.ui.filters="a b" -Dspark.x="p\\q\"r"'}
  - it: prints large whole numbers from values files without an exponent
    values: [values/big.yaml]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: 'spec.template.spec.containers[0].env'
          content: {name: SPARK_HISTORY_OPTS, value: '-Dspark.history.fs.logDirectory="file:/e" -Dspark.history.ui.port="18080" -Dspark.history.ui.maxApplications="1000000"'}
