suite: auth
chart:
  version: 1.0.0
  appVersion: 4.2.0
templates:
  - templates/auth-secret.yaml
  - templates/driver.yaml
  - templates/configmap.yaml
  - templates/NOTES.txt
tests:
  - it: renders nothing for auth when disabled
    templates: [templates/auth-secret.yaml]
    asserts:
      - hasDocuments: {count: 0}
  - it: sets no token env when disabled
    template: templates/driver.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: SPARK_CONNECT_AUTHENTICATE_TOKEN}
          any: true
  - it: generates a 32 character token Secret
    set: {auth: {enabled: true}}
    template: templates/auth-secret.yaml
    asserts:
      - isKind: {of: Secret}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-auth}
      - matchRegex: {path: stringData.token, pattern: '^[A-Za-z0-9]{32}$'}
  - it: gives a live Secret without data a fresh 32 character token
    set: {auth: {enabled: true}}
    template: templates/auth-secret.yaml
    release: {name: sc, namespace: ns}
    kubernetesProvider:
      scheme:
        "v1/Secret": {gvr: {version: v1, resource: secrets}, namespaced: true}
      objects:
        - {apiVersion: v1, kind: Secret, metadata: {name: sc-spark-connect-auth, namespace: ns}}
    asserts:
      - isKind: {of: Secret}
      - matchRegex: {path: stringData.token, pattern: '^[A-Za-z0-9]{32}$'}
  - it: keeps the token of a live Secret
    set: {auth: {enabled: true}}
    template: templates/auth-secret.yaml
    release: {name: sc, namespace: ns}
    kubernetesProvider:
      scheme:
        "v1/Secret": {gvr: {version: v1, resource: secrets}, namespaced: true}
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: sc-spark-connect-auth, namespace: ns}
          data: {token: a25vd24tdG9rZW4=}
    asserts:
      - equal: {path: stringData.token, value: known-token}
  - it: passes the token to the driver from the Secret
    set: {auth: {enabled: true}}
    template: templates/driver.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPARK_CONNECT_AUTHENTICATE_TOKEN
            valueFrom:
              secretKeyRef: {name: RELEASE-NAME-spark-connect-auth, key: token}
  - it: keeps the token out of spark-defaults.conf
    set: {auth: {enabled: true}}
    template: templates/configmap.yaml
    asserts:
      - notMatchRegex: {path: 'data["spark-defaults.conf"]', pattern: 'authenticate.token'}
  - it: uses an existing Secret without rendering one
    set: {auth: {enabled: true, existingSecret: mine, secretKey: k}}
    templates: [templates/auth-secret.yaml]
    asserts:
      - hasDocuments: {count: 0}
  - it: references the existing Secret from the driver
    set: {auth: {enabled: true, existingSecret: mine, secretKey: k}}
    template: templates/driver.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPARK_CONNECT_AUTHENTICATE_TOKEN
            valueFrom:
              secretKeyRef: {name: mine, key: k}
  - it: warns when exposed through an Ingress without auth
    set: {ingress: {connect: {enabled: true}}}
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: 'WARNING: the Spark Connect endpoint is exposed without authentication'}
  - it: warns when exposed through a Gateway without auth
    set: {gateway: {connect: {enabled: true}}}
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: 'WARNING: the Spark Connect endpoint is exposed without authentication'}
  - it: explains TLS instead of warning when exposed with auth
    set: {auth: {enabled: true}, ingress: {connect: {enabled: true}}}
    template: templates/NOTES.txt
    asserts:
      - notMatchRegex: {path: raw, pattern: 'WARNING'}
      - matchRegex: {path: raw, pattern: 'sc://<host>:443/;use_ssl=true;token='}
      - matchRegex: {path: raw, pattern: 'terminate TLS at the Ingress or the Gateway'}
  - it: warns when the service is a LoadBalancer without auth
    set: {service: {type: LoadBalancer}}
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: 'WARNING: the Spark Connect endpoint is exposed without authentication'}
  - it: does not warn about a NodePort service with auth
    set: {service: {type: NodePort}, auth: {enabled: true}}
    template: templates/NOTES.txt
    asserts:
      - notMatchRegex: {path: raw, pattern: 'WARNING'}
      - notMatchRegex: {path: raw, pattern: ':443'}
      - matchRegex: {path: raw, pattern: 'plaintext gRPC'}
      - matchRegex: {path: raw, pattern: 'sc://<host>:<port>/;use_ssl=true;token='}
  - it: does not warn about a LoadBalancer service with auth
    set: {service: {type: LoadBalancer}, auth: {enabled: true}}
    template: templates/NOTES.txt
    asserts:
      - notMatchRegex: {path: raw, pattern: 'WARNING'}
  - it: stays quiet when not exposed
    template: templates/NOTES.txt
    asserts:
      - notMatchRegex: {path: raw, pattern: 'WARNING'}
  - it: prints the plain connection string without auth
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: '(?m)^  sc://localhost:15002$'}
      - notMatchRegex: {path: raw, pattern: 'token'}
  - it: prints the token connection string and the Secret command with auth
    set: {auth: {enabled: true}}
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: '(?m)^  sc://localhost:15002/;token=<token>$'}
      - matchRegex: {path: raw, pattern: "kubectl -n NAMESPACE get secret RELEASE-NAME-spark-connect-auth -o jsonpath='\\{.data.token\\}' \\| base64 -d"}
  - it: names the existing Secret and key in the Secret command
    set: {auth: {enabled: true, existingSecret: mine, secretKey: my.key}}
    template: templates/NOTES.txt
    asserts:
      - matchRegex: {path: raw, pattern: "get secret mine -o jsonpath='\\{.data.my\\\\.key\\}' \\| base64 -d"}
