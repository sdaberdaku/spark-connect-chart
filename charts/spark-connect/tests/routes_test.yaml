suite: routes
chart:
  version: 1.0.0
  appVersion: 4.2.0
templates:
  - templates/routes.yaml
  - templates/ingress.yaml
tests:
  - it: renders nothing by default
    template: templates/routes.yaml
    asserts:
      - hasDocuments: {count: 0}
        template: templates/routes.yaml
  - it: renders a GRPCRoute for connect
    set:
      gateway:
        connect:
          enabled: true
          annotations: {a: b}
          hostnames: [spark.example.com]
          parentRefs: [{name: gw, namespace: infra, sectionName: https}]
    template: templates/routes.yaml
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: GRPCRoute}
      - equal: {path: apiVersion, value: gateway.networking.k8s.io/v1}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-connect}
      - equal: {path: metadata.annotations, value: {a: b}}
      - equal: {path: spec.parentRefs, value: [{name: gw, namespace: infra, sectionName: https}]}
      - equal: {path: spec.hostnames, value: [spark.example.com]}
      - equal: {path: spec.rules, value: [{backendRefs: [{name: RELEASE-NAME-spark-connect, port: 15002}]}]}
  - it: renders an HTTPRoute for the ui
    set:
      gateway:
        ui:
          enabled: true
          parentRefs: [{name: gw}]
    template: templates/routes.yaml
    asserts:
      - isKind: {of: HTTPRoute}
      - equal: {path: apiVersion, value: gateway.networking.k8s.io/v1}
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-ui}
      - equal:
          path: spec.rules
          value:
            - matches: [{path: {type: PathPrefix, value: /}}]
              backendRefs: [{name: RELEASE-NAME-spark-connect, port: 4040}]
  - it: renders an HTTPRoute for the history server
    set:
      historyServer: {enabled: true, logDirectory: "file:/e"}
      gateway:
        historyServer:
          enabled: true
          parentRefs: [{name: gw}]
    template: templates/routes.yaml
    asserts:
      - equal: {path: metadata.name, value: RELEASE-NAME-spark-connect-history-server}
      - equal:
          path: spec.rules
          value:
            - matches: [{path: {type: PathPrefix, value: /}}]
              backendRefs: [{name: RELEASE-NAME-spark-connect-history-server, port: 18080}]
  - it: renders ingress and route for connect together
    set:
      ingress: {connect: {enabled: true, hosts: [{host: a.example.com, paths: [{path: /}]}]}}
      gateway: {connect: {enabled: true, parentRefs: [{name: gw}]}}
    template: templates/routes.yaml
    asserts:
      - hasDocuments: {count: 1}
        template: templates/routes.yaml
      - hasDocuments: {count: 1}
        template: templates/ingress.yaml
  - it: requires parentRefs
    set: {gateway: {connect: {enabled: true}}}
    template: templates/routes.yaml
    asserts:
      - failedTemplate: {errorMessage: gateway.connect.parentRefs is required}
  - it: fails when exposing a disabled history server
    set: {gateway: {historyServer: {enabled: true, parentRefs: [{name: gw}]}}}
    template: templates/routes.yaml
    asserts:
      - failedTemplate: {errorMessage: historyServer.enabled must be true to expose the history server}
