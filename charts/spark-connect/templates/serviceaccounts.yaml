{{- if .Values.serviceAccount.driver.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spark-connect.driverServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-connect.labels" . | nindent 4 }}
    app.kubernetes.io/component: driver
  {{- with .Values.serviceAccount.driver.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.serviceAccount.executor.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spark-connect.executorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-connect.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
  {{- with .Values.serviceAccount.executor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
