{{- if .Values.historyServer.enabled }}
{{- if not .Values.historyServer.logDirectory }}
{{- fail "historyServer.logDirectory is required" }}
{{- end }}
{{- $name := include "spark-connect.nameWith" (list . "history-server") }}
{{- $port := include "spark-connect.num" .Values.historyServer.port }}
{{- $opts := list (printf "-Dspark.history.fs.logDirectory=%s" .Values.historyServer.logDirectory) (printf "-Dspark.history.ui.port=%s" $port) }}
{{- range $k := keys .Values.historyServer.conf | sortAlpha }}
{{- $opts = append $opts (printf "-D%s=%s" $k (toString (get $.Values.historyServer.conf $k))) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-connect.labels" . | nindent 4 }}
    app.kubernetes.io/component: history-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "spark-connect.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: history-server
  template:
    metadata:
      labels:
        {{- include "spark-connect.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: history-server
        {{- with .Values.commonPodLabels }}{{ toYaml . | nindent 8 }}{{ end }}
        {{- with .Values.historyServer.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- if or .Values.commonPodAnnotations .Values.historyServer.podAnnotations }}
      annotations:
        {{- with .Values.commonPodAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
        {{- with .Values.historyServer.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "spark-connect.executorServiceAccountName" . }}
      securityContext:
        {{- include "spark-connect.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.historyServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.historyServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.historyServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: history-server
          image: {{ include "spark-connect.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "spark-connect.containerSecurityContext" . | nindent 12 }}
          command: [/opt/entrypoint.sh, /opt/spark/sbin/start-history-server.sh]
          env:
            - {name: SPARK_NO_DAEMONIZE, value: "true"}
            - {name: SPARK_LOG_DIR, value: /tmp/spark-logs}
            - {name: SPARK_PID_DIR, value: /tmp}
            - {name: SPARK_DAEMON_MEMORY, value: {{ .Values.historyServer.daemonMemory | quote }}}
            - {name: SPARK_HISTORY_OPTS, value: {{ join " " $opts | quote }}}
            {{- with .Values.historyServer.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          {{- with .Values.historyServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- with .Values.historyServer.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- with .Values.historyServer.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-connect.labels" . | nindent 4 }}
    app.kubernetes.io/component: history-server
spec:
  selector:
    {{- include "spark-connect.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: history-server
  ports:
    - {name: http, port: {{ $port }}, targetPort: http}
{{- end }}
