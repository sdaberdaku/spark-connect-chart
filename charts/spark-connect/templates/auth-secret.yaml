{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "spark-connect.nameWith" (list . "auth") }}
{{- /* Keep the token across upgrades: reuse the live Secret's value, else generate one. */}}
{{- $token := randAlphaNum 32 }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with index (.data | default dict) $.Values.auth.secretKey }}{{ $token = b64dec . }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-connect.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ $token | quote }}
{{- end }}
