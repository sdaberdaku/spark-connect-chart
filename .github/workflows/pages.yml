# Builds the docs site (strict) and deploys it to GitHub Pages when docs change on main.
name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - mkdocs.yml
      - charts/spark-connect/README.md.gotmpl
      - charts/spark-connect/values.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: make tools docs
      - run: pip install -r docs/site/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
