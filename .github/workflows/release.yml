# Publishes the chart version from Chart.yaml when it has no tag yet: OCI chart on GHCR, Artifact Hub
# metadata, docs site refresh, and last of all the GitHub Release, which creates the tag. The tag
# therefore exists only after everything else succeeded, and a rerun retries the whole publish.
# Runs from main only: on pushes to main, when discover.yml dispatches it, and on a manual v* tag
# push (recovery path, the tag must be on main and match the chart version).
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: //p' charts/spark-connect/Chart.yaml)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad chart version '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "::error::Tag $REF_NAME does not match chart version $version"; exit 1; }
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::Tag $REF_NAME is not on main"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$REF_NAME" = main ] || { echo "::error::release runs from main only"; exit 1; }
          # ls-remote --exit-code returns 2 when the ref is missing; any other non-zero code is an error, never "publish".
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null || rc=$?
          case $rc in
            0) echo "Tag v$version exists: nothing to release."; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::git ls-remote failed with exit code $rc"; exit 1 ;;
          esac
      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The new tag does not exist yet, so this is the previous release (empty on the first one).
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          [ "$prev" != "v$VERSION" ] || prev=$(git describe --tags --abbrev=0 --match 'v*' "v$VERSION^" 2>/dev/null || true)
          python3 scripts/release_notes.py "$VERSION" "$prev" "$RUNNER_TEMP/notes"
          make tools
          # Only the working copy carries the annotation; it is never committed.
          if [ -s "$RUNNER_TEMP/notes/changes.yaml" ]; then
            .bin/yq -i '.annotations."artifacthub.io/changes" = load_str(strenv(RUNNER_TEMP) + "/notes/changes.yaml")' charts/spark-connect/Chart.yaml
          fi
          cat "$RUNNER_TEMP/notes/notes.md"
      - name: Package the chart
        if: steps.version.outputs.publish == 'true'
        run: make tools schema docs package
      - name: Push the chart to GHCR
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | .bin/helm registry login ghcr.io -u "$ACTOR" --password-stdin
          .bin/helm push "dist/spark-connect-$VERSION.tgz" oci://ghcr.io/sdaberdaku/charts
      - name: Install oras
        if: steps.version.outputs.publish == 'true'
        uses: oras-project/setup-oras@v2.0.3
      - name: Push the Artifact Hub metadata
        if: steps.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          oras push ghcr.io/sdaberdaku/charts/spark-connect:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Refresh the docs site and create the GitHub Release (creates the tag)
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" "dist/spark-connect-$VERSION.tgz" \
              --target "$GITHUB_SHA" --title "spark-connect $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md"
          fi
          gh workflow run pages.yml --ref main || echo "::warning::could not refresh the docs site"
